[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# NOTE: project metadata (name, version, dependencies, entry points, etc.)
# lives in setup.py, not here. This file previously also declared a full
# [project] table with its own (stale) dependency list and console scripts
# pointing at spev_tts.py/spev_advanced.py, which no longer exist. Modern
# setuptools treats [project] in pyproject.toml as authoritative once any
# field is set here, which conflicted with setup.py's setup() call passing
# the same fields (install_requires, entry_points) — a real source of
# install-time errors, not just outdated docs. Keeping metadata in exactly
# one place (setup.py) avoids that. This file now only carries the build
# backend declaration and dev-tool configuration.

[tool.black]
line-length = 120
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | hifi-gan
  | data
  | checkpoints
  | vocoder_checkpoints
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip_gitignore = true
extend_skip_glob = ["hifi-gan/*", "data/*", "checkpoints/*"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=. --cov-report=html --cov-report=term"